name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Clang comes from apt.llvm.org in the same major version as on the development
# machines, which keeps clang-format and clang-tidy results identical to a
# local run.
env:
  LLVM_VERSION: 22

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            setup: --buildtype=debug
          - name: release
            setup: --buildtype=release
          - name: asan-ubsan
            setup: -Db_sanitize=address,undefined
          - name: tsan
            setup: -Db_sanitize=thread
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-$LLVM_VERSION clang-tidy-$LLVM_VERSION clang-format-$LLVM_VERSION \
            llvm-$LLVM_VERSION libclang-rt-$LLVM_VERSION-dev g++-14 mold meson ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      - name: Configure
        run: meson setup build --native-file cross/linux-clang.ini ${{ matrix.setup }}

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --suite StructuredChaos --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.name }}
          path: build/meson-logs/testlog.txt

  # Native counterpart of cross/win64-clang-cl.ini: clang-cl with lld-link
  # against the MSVC runtime.
  windows:
    name: windows-${{ matrix.buildtype }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
    env:
      CC: clang-cl
      CXX: clang-cl
      CC_LD: lld-link
      CXX_LD: lld-link
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson
        run: pip install meson ninja

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      - name: Configure
        run: >-
          meson setup build --buildtype=${{ matrix.buildtype }}
          -Dcpp_std=c++latest -Db_vscrt=static_from_buildtype

      - name: Build
        run: meson compile -C build

      - name: Test
        run: meson test -C build --suite StructuredChaos --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-windows-${{ matrix.buildtype }}
          path: build/meson-logs/testlog.txt

  lint:
    name: format + tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-$LLVM_VERSION clang-tidy-$LLVM_VERSION clang-format-$LLVM_VERSION \
            llvm-$LLVM_VERSION libclang-rt-$LLVM_VERSION-dev g++-14 mold meson ninja-build
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      - name: Configure
        run: meson setup build --native-file cross/linux-clang.ini

      - name: clang-format
        run: ninja -C build clang-format-check

      # No build needed: the config header is generated at configure time.
      - name: clang-tidy
        run: run-clang-tidy -quiet -p build -warnings-as-errors='*' "^$PWD/(src|tests)/"
