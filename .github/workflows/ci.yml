name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Clang comes from apt.llvm.org in the same major version as on the development
# machines, which keeps clang-format and clang-tidy results identical to a
# local run.
env:
  LLVM_VERSION: 22

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug
            setup: --buildtype=debug
          - name: release
            setup: --buildtype=release
          - name: asan-ubsan
            setup: -Db_sanitize=address,undefined
          - name: tsan
            setup: -Db_sanitize=thread
    env:
      CCACHE_DIR: /home/runner/.cache/ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      # The key is unique per commit so every run saves its updated cache; the
      # restore key picks up the most recent one of the same configuration.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-${{ matrix.name }}-

      - name: Configure
        run: >-
          meson setup build --native-file cross/linux-clang.ini ${{ matrix.setup }}

      - name: Build
        run: |
          ccache --zero-stats
          meson compile -C build
          ccache --show-stats

      - name: Test
        run: meson test -C build --suite StructuredChaos --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-${{ matrix.name }}
          path: build/meson-logs/testlog.txt

  # Native counterpart of cross/win64-clang-cl.ini: clang-cl with lld-link
  # against the MSVC runtime.
  windows:
    name: windows-${{ matrix.buildtype }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        buildtype: [debug, release]
    env:
      CC: clang-cl
      CXX: clang-cl
      CC_LD: lld-link
      CXX_LD: lld-link
      SCCACHE_DIR: C:\sccache
      SCCACHE_CACHE_SIZE: 500M
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Meson
        run: pip install meson ninja

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Meson drops a compiler cache prefix for clang-cl, so sccache goes in
      # front of it on PATH as a copy named clang-cl instead. Invoked under a
      # foreign name it forwards to the next clang-cl on PATH.
      - name: Wrap clang-cl with sccache
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'sccache-wrap'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item (Get-Command sccache).Source (Join-Path $dir 'clang-cl.exe')
          Add-Content $env:GITHUB_PATH $dir

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: sccache-${{ runner.os }}-${{ matrix.buildtype }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-${{ matrix.buildtype }}-

      - name: Configure
        run: >-
          meson setup build --buildtype=${{ matrix.buildtype }}
          -Dcpp_std=c++latest -Db_vscrt=static_from_buildtype

      - name: Build
        run: meson compile -C build

      - name: sccache statistics
        if: always()
        run: sccache --show-stats

      - name: Test
        run: meson test -C build --suite StructuredChaos --print-errorlogs

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlog-windows-${{ matrix.buildtype }}
          path: build/meson-logs/testlog.txt

  lint:
    name: format + tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          llvm-version: ${{ env.LLVM_VERSION }}

      - name: Cache subprojects
        uses: actions/cache@v4
        with:
          path: |
            subprojects/*/
            !subprojects/packagefiles/
            !subprojects/rapidHash/
          key: subprojects-${{ runner.os }}-${{ hashFiles('subprojects/*.wrap', 'subprojects/packagefiles/**') }}

      - name: Configure
        run: meson setup build --native-file cross/linux-clang.ini

      - name: clang-format
        run: ninja -C build clang-format-check

      # No build needed: the config header is generated at configure time.
      - name: clang-tidy
        run: run-clang-tidy -quiet -p build -warnings-as-errors='*' "^$PWD/(src|tests)/"
