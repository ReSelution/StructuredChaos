name: Set up toolchain
description: Installs Clang, libstdc++ and the build tools from the Fedora repositories, the same as on the development machines.

runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        dnf install -y --setopt=install_weak_deps=False \
          clang clang-tools-extra compiler-rt gcc-c++ mold meson ninja-build ccache
        clang++ --version
        rpm -q libstdc++
