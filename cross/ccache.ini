# Overlay for cross/linux-clang.ini that routes the compilers through ccache.
# Meson only auto-detects ccache when no compiler is named explicitly, so it
# has to be spelled out once a native file sets the binaries.
#
#   meson setup build --native-file cross/linux-clang.ini --native-file cross/ccache.ini

[binaries]
c = ['ccache', 'clang']
cpp = ['ccache', 'clang++']
